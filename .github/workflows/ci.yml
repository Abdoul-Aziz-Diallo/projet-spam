name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier que les notebooks sont lisibles
        run: |
          python - <<'EOF'
          import glob, nbformat
          fichiers = sorted(glob.glob("notebooks/*.ipynb"))
          assert fichiers, "aucun notebook trouvé"
          for f in fichiers:
              nb = nbformat.read(f, as_version=4)
              print("OK :", f, "-", len(nb.cells), "cellules")
          EOF